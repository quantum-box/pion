<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pion · Rust ワークスペース</title>
<style>
:root {
  color-scheme: dark;
  font: 14px/1.55 system-ui, sans-serif;
  color: #edf3fc;
  background: #0c111b;
  --surface: #121b2a;
  --field: #0e1623;
  --border: #2c3b51;
  --muted: #a9b8ce;
  --accent: #a9d2ff;
  --mono: ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; overflow: hidden; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 1.2rem; line-height: 1.35; }
h3 { font-size: 1rem; }
small, label, #source-status { color: var(--muted); }
a { color: var(--accent); text-underline-offset: .22em; }
[hidden] { display: none !important; }

.controls { display: flex; flex-wrap: wrap; gap: 12px; }
.filters {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px;
  gap: 6px 8px;
}
label { display: grid; gap: 5px; min-width: 0; font-size: .86rem; }
input, select, button { font: inherit; color: #edf3fc; }
select, input[type=search], button {
  min-width: 0;
  max-width: 100%;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--field);
  padding: 8px 10px;
}
label select, label input { width: 100%; font-size: 1rem; }
input[type=search]::placeholder { color: var(--muted); }
button, select, summary { cursor: pointer; }
button:hover:not(:disabled), select:hover { border-color: #7188a7; }
button:disabled { opacity: .6; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

#scene { overflow: hidden; min-width: 0; }
#graph-viewport { position: relative; display: flex; flex-direction: column; min-height: 0; }
#scene-toolbar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 12px;
  padding: 12px 14px;
}
.scene-actions { display: flex; flex-wrap: wrap; gap: 8px; }
canvas {
  width: 100%;
  height: clamp(340px, 57vh, 720px);
  display: block;
  touch-action: none;
  cursor: grab;
  background: radial-gradient(ellipse at 50% 45%, #1b2d45, transparent 72%), #0b1321;
}
canvas:active { cursor: grabbing; }
.scene-footer { padding: 7px 10px; border-top: 1px solid var(--border); }
.legend { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-bottom: 3px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; overflow-wrap: anywhere; }
.legend span::before { content: ""; flex: none; background: var(--color); width: 8px; height: 8px; border-radius: 50%; }
#scene { position: fixed; inset: 0; }
#scene #graph-viewport { position: absolute; inset: 0; }
#scene canvas { height: 100%; }
#scene #scene-controls {
  position: absolute;
  inset: 12px 12px auto auto;
  z-index: 3;
  display: grid;
  gap: 6px;
  width: min(540px, calc(100% - 24px));
  pointer-events: none;
}
#scene .filters, #scene .scene-actions, #scene .scene-footer, #scene .map-panel {
  background: linear-gradient(145deg, rgb(141 185 242 / 24%), rgb(9 19 37 / 34%) 70%);
  border: 1px solid rgb(181 214 255 / 29%);
  border-top-color: rgb(218 235 255 / 56%);
  border-left-color: rgb(202 226 255 / 42%);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgb(0 0 0 / 26%), inset 0 1px 0 rgb(236 246 255 / 15%);
  -webkit-backdrop-filter: blur(6px) saturate(150%) brightness(1.2);
  backdrop-filter: blur(6px) saturate(150%) brightness(1.2);
}
#scene-controls :is(button, select, input[type=search]) {
  background: rgb(6 14 28 / 38%);
  border-color: rgb(172 205 249 / 25%);
  font-size: .86rem;
  min-height: 32px;
  padding: 4px 7px;
}
#scene-controls label { gap: 3px; font-size: .78rem; }
#scene .filters { margin: 0; pointer-events: auto; }
#change-file-label { grid-column: span 2; }
#change-file-label:has(+ [hidden]) { grid-column: 1 / -1; }
#scene #scene-toolbar { padding: 0; }
#scene .scene-actions { padding: 4px; gap: 4px; pointer-events: auto; }
#scene .scene-footer {
  position: absolute;
  inset: auto auto 12px 12px;
  z-index: 3;
  max-width: calc(100% - 24px);
  pointer-events: none;
}
@media (max-width: 520px) {
  #scene .scene-footer { padding: 8px 10px; }
}
#graph-tooltip {
  position: absolute;
  z-index: 2;
  pointer-events: none;
  max-width: min(360px, calc(100% - 16px));
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface);
  white-space: pre-line;
  overflow-wrap: anywhere;
  font-size: .9rem;
  box-shadow: 0 4px 14px #0005;
}
aside { padding: 10px; min-width: 0; overflow-wrap: anywhere; }
#route-label { margin-bottom: 14px; }
#details > * + * { margin-top: 10px; }
#details > code { display: block; color: var(--muted); font: .86rem/1.5 var(--mono); }
#details h3 { border-top: 1px solid var(--border); padding-top: 12px; }
aside ol, aside ul { padding-left: 20px; margin-bottom: 0; }
aside li + li { margin-top: 6px; }
aside button, #code-relations button { padding: 4px 8px; text-align: left; overflow-wrap: anywhere; }

#source-panel { padding: 10px; min-width: 0; }
.map-panel {
  justify-self: end;
  width: min(100%, 340px);
  max-height: 40dvh;
  overflow: auto;
  overscroll-behavior: contain;
  pointer-events: auto;
}
#source-panel.map-panel { width: 100%; }
#source-panel .controls { margin-block: 8px; gap: 6px 8px; }
#source-panel label { flex: 1 1 135px; }
#source-status { margin-top: 5px; }
#source-path { font: .9rem/1.6 var(--mono); color: var(--muted); overflow-wrap: anywhere; margin-top: 12px; }
#source-lines {
  max-height: 30dvh;
  overflow: auto;
  background: rgb(6 14 28 / 45%);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 0;
  font: 13px/1.55 var(--mono);
  tab-size: 4;
}
.source-line { display: flex; min-width: max-content; min-height: 1.55em; }
.source-line:target, .source-line.active { background: #263d5b; }
.source-number { color: var(--muted); min-width: 4.8em; text-align: right; padding-right: 1em; user-select: none; }
.source-line code { white-space: pre; }
#code-relations { margin-block: 8px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; }
#code-relations ul { list-style: none; border-left: 2px solid var(--border); padding-left: 12px; }
#code-relations li { margin-block: 6px; }
@media (max-width: 520px) {
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .filters label:nth-child(2) { grid-column: 1 / -1; grid-row: 1; }
}
</style>
</head>
<body>
<main id="scene" aria-label="3D依存グラフ">
<div id="scene-controls">
<div class="controls filters" id="crate-filters">
<label>領域<select id="group"><option value="">すべて</option></select></label>
<label>クレートを検索<input id="search" type="search" placeholder="名前またはパス"></label>
<label>クレート<select id="crate"></select></label>
<label>分析<select id="mode"><option value="direct">直接依存</option><option value="impact">変更の波及範囲</option><option value="upstream">間接依存先</option></select></label>
<label>構造の表示<select id="structure-view"><option value="all">構造と参照</option><option value="tree">ディレクトリ構造</option><option value="review">レイヤーの逆向き参照</option><option value="changes">差分レビュー</option></select></label>
<label id="change-file-label" hidden>変更ファイル<select id="change-file"><option value="">変更全体</option></select></label>
<label id="change-edge-label" hidden>表示する参照<select id="change-edge"><option value="all">周辺の依存を含む</option><option value="delta">増減した依存のみ</option></select></label>
<label><span>依存種別</span><select id="kind"><option value="normal">通常依存</option><option value="all">通常・開発・ビルド</option></select></label>
</div>
<div id="scene-toolbar">
<div class="scene-actions">
<button id="browse-details" type="button" aria-controls="details-panel" aria-expanded="false">クレート詳細</button>
<button id="browse-source" type="button" aria-controls="source-panel" aria-expanded="false" disabled>ソースコード</button>
<button id="file-dependencies" type="button" hidden>ファイル依存</button>
<button id="graph-source" type="button" hidden>このファイルを読む</button>
<button id="code-back" type="button" hidden>戻る</button>
</div>
</div>
<aside id="details-panel" class="map-panel" hidden><label id="route-label" hidden>経路の終点<select id="route"></select></label><div id="details"><h2>クレート詳細</h2><p>クレートを選ぶと、依存関係と定義ファイルを表示します。</p></div></aside>
<section id="source-panel" class="map-panel" hidden>
  <h2 id="source-title" tabindex="-1">ソースコード</h2>
  <p id="source-status" role="status"></p>
  <div class="controls" id="source-controls" hidden>
    <label>ファイルを絞り込む<input id="file-query" type="search" placeholder="src/lib.rs"></label>
    <label>Rustファイル<select id="source-file"></select></label>
    <label>宣言へ移動<select id="source-symbol"></select></label>
  </div>
  <details id="code-relations">
    <summary>宣言と参照箇所</summary>
    <div class="controls">
      <label>クレート内の宣言を検索<input id="symbol-query" type="search" placeholder="関数名・型名・モジュール名"></label>
      <label>調べる宣言<select id="symbol-target"></select></label>
    </div>
    <div id="symbol-links" aria-live="polite"></div>
  </details>
  <p><button id="open-code-graph" type="button" disabled>選択したファイルを3Dで見る</button> <button id="source-file-dependencies" type="button" hidden>このファイルの依存を3Dで見る</button></p>
  <div id="source-path"></div>
  <pre id="source-lines" aria-label="行番号付きRustソース" tabindex="0" hidden></pre>
</section>
</div>
<div id="graph-viewport">
<canvas aria-label="Rustクレートの3D依存グラフ。ドラッグで回転、ピンチで拡大縮小できます。"></canvas>
<div id="graph-tooltip" role="tooltip" hidden></div>
</div>
<div class="scene-footer">
<div class="legend" id="legend"></div>
<small id="map-help">ドラッグで回転、ピンチで拡大縮小、Shift＋ドラッグで移動。色の輪郭はクレートの範囲、四角はディレクトリ、小さな点はRustファイル。橙の線は内側のレイヤーから外側への参照候補。</small>
<small id="change-summary" hidden></small>
</div>
</main>
<script id="workspace" type="application/json">__PION_WORKSPACE__</script>
<script id="source-snapshot" type="application/json">__PION_SOURCE_SNAPSHOT__</script>
<script id="pion-references" type="application/json">__PION_REFERENCES__</script>
<script>
"use strict";
const elements = Object.fromEntries(["group","search","crate","mode","kind","structure-view","route","route-label","legend","details","workspace"].map(id => [id, document.getElementById(id)]));
const {nodes, edges, changed_rust_paths = [], dependency_changes = null} = JSON.parse(elements.workspace.textContent);
const groups = [...new Set(nodes.map(node => node.group))].sort();
const colors = Object.fromEntries(groups.map((group,index) =>
  [group,"hsl("+((205+index*137.5)%360)+" 75% 73%)"]));
const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");
let selected = null;
let matches = new Set();
let points = [];
let visiblePoints = [];
let visibleFilePoints = [];
let visibleDirectories = [];
let visibleReviewEdges = [];
let visibleEdges = [];
let codeGraph = null;
const camera = {yaw:15,pitch:22,zoom:110,panX:0,panY:0};
let localZoom = 100;
const semanticReferences = JSON.parse(document.getElementById("pion-references").textContent);
const semanticFiles = semanticReferences.files ?? [];
const semanticPaths = new Map(semanticFiles.map(([index,path],id) => [index+":"+path,id]));
function indexedReferences(index,path,line) {
  const fileId = semanticPaths.get(index+":"+path);
  const matches = semanticReferences.definitions?.[fileId]?.[line];
  if (!matches) return null;
  return matches.map(([fileId,line]) => {
    const [crate,path] = semanticFiles[fileId];
    return {crate,path,line,label:nodes[crate].name+" · "+path+":"+line,
      text:crate === sourceCrate ? sourceFiles[path]?.split("\n")[line-1]?.trim() : ""};
  });
}
const codeBack = document.getElementById("code-back");
const codeOpen = document.getElementById("open-code-graph");

const dependencyButton = document.getElementById("file-dependencies");
const sourceDependencyButton = document.getElementById("source-file-dependencies");
const graphSource = document.getElementById("graph-source");
const fileDependencies = semanticReferences.file_dependencies ?? {};
const indexedFiles = new Set(semanticReferences.indexed_files ?? []);
const fileDependents = new Map();
for (const [from,targets] of Object.entries(fileDependencies)) {
  for (const [to,count] of Object.entries(targets)) {
    const file = Number(to);
    if (!fileDependents.has(file)) fileDependents.set(file,new Map());
    fileDependents.get(file).set(Number(from),count);
  }
}
function fileLocation(id) {
  const [crate,path] = semanticFiles[id];
  return {file:id,crate,path,line:1,label:nodes[crate].name+" · "+path};
}
let workspaceFileGraph;
const architectureLayers = new Map([
  ["domain",{name:"Domain",height:0.95,rank:0}],
  ["application",{name:"Application",height:0.35,rank:1}],
  ["usecase",{name:"Application",height:0.35,rank:1}],
  ["usecases",{name:"Application",height:0.35,rank:1}],
  ["infrastructure",{name:"Infrastructure",height:-0.30,rank:2}],
  ["infra",{name:"Infrastructure",height:-0.30,rank:2}],
  ["presentation",{name:"Presentation",height:-0.75,rank:2}]
]);
function buildWorkspaceFileGraph() {
  const files = semanticFiles.length ? semanticFiles : Object.entries(sourcePayload)
    .flatMap(([crate,files]) => Object.keys(files).map(path => [Number(crate),path]));
  const root = {path:".",children:new Map(),files:[],depth:0,internal:0,external:0};
  function directory(path) {
    return path.filter(Boolean).reduce((parent,segment) => {
      if (!parent.children.has(segment)) {
        parent.children.set(segment,{path:parent.path === "." ? segment : parent.path+"/"+segment,
          parent,depth:parent.depth+1,children:new Map(),files:[],internal:0,external:0,
          layer:architectureLayers.get(segment.toLowerCase()) ?? parent.layer});
      }
      return parent.children.get(segment);
    },root);
  }
  const crates = nodes.map(({path}) => directory(path.split("/").slice(0,-1)));
  const marks = files.map(([crate,path]) => {
    const segments = path.split("/");
    const owner = directory([...nodes[crate].path.split("/").slice(0,-1),...segments.slice(0,-1)]);
    const file = {crate,path,line:1,label:nodes[crate].name+" · "+path,owner};
    owner.files.push(file);
    return file;
  });
  const ancestors = marks.map(({owner}) => {
    const chain = new Set();
    for (let entry = owner; entry; entry = entry.parent) chain.add(entry);
    return chain;
  });
  const connections = Object.entries(fileDependencies).flatMap(([from,targets]) =>
    Object.keys(targets).map(to => [Number(from),Number(to)]));
  const reviewConnections = [];
  for (const [from,to] of connections) {
    const source = ancestors[from];
    const target = ancestors[to];
    for (const entry of source) {
      if (target.has(entry)) entry.internal++;
      else entry.external++;
    }
    for (const entry of target) {
      if (!source.has(entry)) entry.external++;
    }
    const a = marks[from].owner.layer;
    const b = marks[to].owner.layer;
    if (a && b && a.rank < b.rank) reviewConnections.push([from,to]);
  }
  function countEntries(entry) {
    entry.size = 1+entry.files.length;
    for (const child of entry.children.values()) entry.size += countEntries(child);
    return entry.size;
  }
  countEntries(root);
  const directories = [];
  function layout(entry,left,right,front,back) {
    const x = (left+right)/2;
    const z = (front+back)/2;
    const y = (entry.layer?.height ?? -0.12)+Math.min(entry.depth,12)*0.065;
    const refs = entry.internal+entry.external;
    entry.cohesion = refs ? entry.internal/refs : null;
    entry.position = [x,y,z];
    directories.push(entry);
    const children = [...entry.children.values()].sort((a,b) => a.path.localeCompare(b.path));
    const entries = [...children,...entry.files];
    const weights = entries.map(item => Math.sqrt(item.size ?? 1));
    const total = weights.reduce((sum,weight) => sum+weight,0);
    const splitX = right-left >= back-front;
    let cursor = splitX ? left : front;
    entries.forEach((item,index) => {
      const extent = (splitX ? right-left : back-front)*weights[index]/total;
      const end = cursor+extent;
      if (index < children.length) {
        if (splitX) layout(item,cursor,end,front,back);
        else layout(item,left,right,cursor,end);
      } else {
        const pull = (entry.cohesion ?? 0)*0.32;
        const slot = (cursor+end)/2;
        item.position = [splitX ? slot+(x-slot)*pull : x,y+0.075,
          splitX ? z : slot+(z-slot)*pull];
      }
      cursor = end;
    });
  }
  layout(root,-3.4,3.4,-2.5,2.5);
  const changeMarks = [...marks];
  const pathIds = new Map(marks.map((file,id) => [[...nodes[file.crate].path.split("/").slice(0,-1),file.path].join("/"),id]));
  const directoriesByPath = new Map(directories.map(entry => [entry.path,entry]));
  function changeId(path) {
    if (pathIds.has(path)) return pathIds.get(path);
    const segments = path.split("/");
    segments.pop();
    while (segments.length && !directoriesByPath.has(segments.join("/"))) segments.pop();
    const owner = directoriesByPath.get(segments.join("/")) ?? root;
    const id = changeMarks.length;
    const [x,y,z] = owner.position;
    const offset = 0.04*((id%7)+1);
    changeMarks.push({crate:null,path,label:path,owner,removed:true,
      position:[x+offset,y+0.1,z-offset]});
    pathIds.set(path,id);
    return id;
  }
  const changed = new Set(changed_rust_paths
    .filter(path => pathIds.has(path) || dependency_changes)
    .map(changeId));
  const deltas = [];
  const modifiedPairs = new Set();
  for (const kind of ["added","removed"]) {
    for (const [source,target,count] of dependency_changes?.[kind] ?? []) {
      const from = changeId(source);
      const to = changeId(target);
      deltas.push([from,to,kind,count]);
      modifiedPairs.add(from+":"+to);
    }
  }
  const changeConnections = [...connections
    .filter(([from,to]) => (changed.has(from)||changed.has(to)) && !modifiedPairs.has(from+":"+to)),
    ...deltas];
  const affected = new Set([...changed,...changeConnections.flatMap(([from,to]) => [from,to])]);
  const affectedCrates = new Set([...affected].map(id => changeMarks[id].crate));
  const changeFile = document.getElementById("change-file");
  for (const id of changed) changeFile.add(new Option(changeMarks[id].label,id));
  return {marks,connections,reviewConnections,directories,cratePositions:crates.map(entry => entry.position),
    changed,affected,affectedCrates,changeConnections,changeMarks,
    crateFiles:marks.reduce((groups,file,id) => {
      groups[file.crate].push(id);
      return groups;
    },nodes.map(() => []))};
}
function openFileDependencies(file,previousFile = null) {
  function links(id) {
    const outgoing = fileDependencies[id] ?? {};
    const incoming = fileDependents.get(id) ?? new Map();
    return [...new Set([...Object.keys(outgoing).map(Number),...incoming.keys()])]
      .map(other => [other,(outgoing[other] ?? 0)+(incoming.get(other) ?? 0)]);
  }
  const direct = links(file).sort(([a,countA],[b,countB]) =>
    Number(b === previousFile)-Number(a === previousFile) || countB-countA || a-b);
  const directIds = new Set(direct.map(([id]) => id));
  const first = direct.slice(0,36);
  const second = new Map();
  for (const [id] of first) {
    for (const [candidate,count] of links(id)) {
      if (candidate !== file && !directIds.has(candidate)) {
        second.set(candidate,(second.get(candidate) ?? 0)+count);
      }
    }
  }
  const outer = [...second].sort(([a,countA],[b,countB]) => countB-countA || a-b).slice(0,44);
  const neighbors = [
    ...first.map(([id]) => ({...fileLocation(id),hops:1})),
    ...outer.map(([id]) => ({...fileLocation(id),hops:2}))
  ];
  const root = fileLocation(file);
  const marks = [root,...neighbors];
  const indices = new Map(marks.map((item,index) => [item.file,index]));
  const connections = marks.flatMap((item,from) => Object.entries(fileDependencies[item.file] ?? {})
    .filter(([id]) => indices.has(Number(id)))
    .map(([id,count]) => [from,indices.get(Number(id)),count]));
  codeGraph = {fileDependencies:true,root,neighbors,connections,firstCount:first.length};
  setPanel(null);
  renderGraphMode();
}
function currentFileId() {
  const file = semanticPaths.get(sourceCrate+":"+sourceUI["source-file"].value);
  return indexedFiles.has(file) ? file : undefined;
}
dependencyButton.onclick = sourceDependencyButton.onclick = () => openFileDependencies(currentFileId());
graphSource.onclick = () => activateCodeNode(0);

function openCodeGraph(path, symbol = null) {
  const fileDeclarations = declarations.filter(item => item.path === path);
  const root = symbol ? {...symbol,label:symbol.kind+" "+symbol.name} : {path,line:1,label:path};
  const neighbors = [];
  let total = 0;
  const indexed = symbol ? indexedReferences(sourceCrate,path,symbol.line) : null;
  if (indexed) {
    total = indexed.length;
    neighbors.push(...indexed.slice(0,100));
  } else if (symbol) {
    const keyword = new RegExp("\\b"+symbol.name+"\\b");
    const definitions = new Set(declarations.filter(item => item.name === symbol.name)
      .map(item => item.path+":"+item.line));
    for (const [file,source] of Object.entries(sourceFiles)) {
      source.split("\n").forEach((text,index) => {
        const line = index+1;
        if (!keyword.test(text) || definitions.has(file+":"+line)) return;
        total++;
        if (neighbors.length < 100) neighbors.push({path:file,line,label:file+":"+line,text:text.trim()});
      });
    }
  } else {
    total = fileDeclarations.length;
    neighbors.push(...fileDeclarations.slice(0,100).map(item => ({...item,label:item.kind+" "+item.name})));
  }
  codeGraph = {path,symbol,root,neighbors,total,indexed:indexed !== null};
